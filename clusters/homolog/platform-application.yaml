apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-platform
  namespace: argocd
spec:
  project: togglemaster
  source:
    repoURL: https://github.com/JulioDinizN/tech-challenge-fase-3-gitops.git
    targetRevision: main
    path: platform/overlays/homolog
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
