apiVersion: v1
data:
  auth.sql: "CREATE TABLE IF NOT EXISTS api_keys (\n    id SERIAL PRIMARY KEY,\n \
    \   name VARCHAR(100) NOT NULL,\n    key_hash VARCHAR(64) NOT NULL UNIQUE,\n \
    \   is_active BOOLEAN DEFAULT true,\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT\
    \ CURRENT_TIMESTAMP\n);\n"
  flags.sql: "CREATE TABLE IF NOT EXISTS flags (\n    id SERIAL PRIMARY KEY,\n   \
    \ name VARCHAR(100) UNIQUE NOT NULL,\n    description TEXT,\n    is_enabled BOOLEAN\
    \ NOT NULL DEFAULT false,\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,\n\
    \    updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP\n);\n\nCREATE\
    \ OR REPLACE FUNCTION trigger_set_timestamp()\nRETURNS TRIGGER AS $$\nBEGIN\n\
    \  NEW.updated_at = NOW();\n  RETURN NEW;\nEND;\n$$ LANGUAGE plpgsql;\n\nDROP\
    \ TRIGGER IF EXISTS set_timestamp ON flags;\n\nCREATE TRIGGER set_timestamp\n\
    BEFORE UPDATE ON flags\nFOR EACH ROW\nEXECUTE PROCEDURE trigger_set_timestamp();\n"
  init.sh: "#!/bin/sh\nset -eu\n\nADMIN_PASSWORD=\"$(cat /mnt/secrets-store/admin-password)\"\
    \nAPP_PASSWORD=\"$(cat /mnt/secrets-store/app-password)\"\nexport PGSSLMODE=\"\
    ${DB_SSLMODE:-require}\"\n\nattempt=0\nuntil PGPASSWORD=\"$ADMIN_PASSWORD\" pg_isready\
    \ \\\n  --host=\"$DB_HOST\" --port=\"$DB_PORT\" --username=\"$DB_ADMIN_USER\"\
    \ --dbname=postgres; do\n  attempt=$((attempt + 1))\n  if [ \"$attempt\" -ge 30\
    \ ]; then\n    echo \"PostgreSQL n\xE3o ficou dispon\xEDvel dentro do prazo.\"\
    \ >&2\n    exit 1\n  fi\n  sleep 5\ndone\n\nPGPASSWORD=\"$ADMIN_PASSWORD\" psql\
    \ \\\n  --host=\"$DB_HOST\" \\\n  --port=\"$DB_PORT\" \\\n  --username=\"$DB_ADMIN_USER\"\
    \ \\\n  --dbname=postgres \\\n  --set=ON_ERROR_STOP=1 \\\n  --set=app_user=\"\
    $DB_APP_USER\" \\\n  --set=app_password=\"$APP_PASSWORD\" \\\n  --set=db_name=\"\
    $DB_NAME\" <<'SQL'\nSELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user',\
    \ :'app_password')\nWHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user')\
    \ \\gexec\nSELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user',\
    \ :'app_password') \\gexec\n-- OCI Database with PostgreSQL grants CREATEROLE\
    \ to the administrator without\n-- making it a superuser. PostgreSQL therefore\
    \ requires role membership before\n-- that administrator can assign database ownership\
    \ to the application role.\nSELECT format('GRANT %I TO %I', :'app_user', current_user)\
    \ \\gexec\nSELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'app_user')\n\
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db_name') \\gexec\n\
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'db_name', :'app_user') \\gexec\n\
    SQL\n\nPGPASSWORD=\"$APP_PASSWORD\" psql \\\n  --host=\"$DB_HOST\" \\\n  --port=\"\
    $DB_PORT\" \\\n  --username=\"$DB_APP_USER\" \\\n  --dbname=\"$DB_NAME\" \\\n\
    \  --set=ON_ERROR_STOP=1 \\\n  --file=\"/database-init/$SCHEMA_FILE\"\n\n# Membership\
    \ is needed only while assigning ownership. Remove it after the\n# application\
    \ role has initialized its own schema; a later idempotent run will\n# grant it\
    \ again before ownership operations.\nPGPASSWORD=\"$ADMIN_PASSWORD\" psql \\\n\
    \  --host=\"$DB_HOST\" \\\n  --port=\"$DB_PORT\" \\\n  --username=\"$DB_ADMIN_USER\"\
    \ \\\n  --dbname=postgres \\\n  --set=ON_ERROR_STOP=1 \\\n  --set=app_user=\"\
    $DB_APP_USER\" <<'SQL'\nSELECT format('REVOKE %I FROM %I', :'app_user', current_user)\
    \ \\gexec\nSQL\n\necho \"Banco $DB_NAME e schema $SCHEMA_FILE inicializados com\
    \ sucesso.\"\n"
  targeting.sql: "CREATE TABLE IF NOT EXISTS targeting_rules (\n    id SERIAL PRIMARY\
    \ KEY,\n    flag_name VARCHAR(100) UNIQUE NOT NULL,\n    is_enabled BOOLEAN NOT\
    \ NULL DEFAULT true,\n    rules JSONB NOT NULL,\n    created_at TIMESTAMP WITH\
    \ TIME ZONE DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP WITH TIME ZONE\
    \ DEFAULT CURRENT_TIMESTAMP\n);\n\nCREATE OR REPLACE FUNCTION trigger_set_timestamp()\n\
    RETURNS TRIGGER AS $$\nBEGIN\n  NEW.updated_at = NOW();\n  RETURN NEW;\nEND;\n\
    $$ LANGUAGE plpgsql;\n\nDROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;\n\
    \nCREATE TRIGGER set_timestamp\nBEFORE UPDATE ON targeting_rules\nFOR EACH ROW\n\
    EXECUTE PROCEDURE trigger_set_timestamp();\n"
