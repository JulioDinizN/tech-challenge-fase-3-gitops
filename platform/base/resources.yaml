apiVersion: batch/v1
kind: Job
metadata:
  name: auth-database-init
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '1'
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-database-init
    spec:
      containers:
      - command:
        - /bin/sh
        - /database-init/init.sh
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_HOST
              name: togglemaster-config
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              key: DB_PORT
              name: togglemaster-config
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              key: DB_SSLMODE
              name: togglemaster-config
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_NAME
              name: togglemaster-config
        - name: DB_APP_USER
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_USER
              name: togglemaster-config
        - name: DB_ADMIN_USER
          value: togglemaster_admin
        - name: SCHEMA_FILE
          value: auth.sql
        image: docker.io/postgres:16-alpine
        name: database-init
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /mnt/secrets-store
          name: secrets-store-inline
          readOnly: true
        - mountPath: /database-init
          name: database-init
          readOnly: true
        - mountPath: /tmp
          name: tmp
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: database-init
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: auth-database-init-secrets
        name: secrets-store-inline
      - configMap:
          defaultMode: 365
          name: database-init-t6g6h9t7t4
        name: database-init
      - emptyDir:
          sizeLimit: 32Mi
        name: tmp
  ttlSecondsAfterFinished: 86400
---
