apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: auth-service
  namespace: togglemaster
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: auth-service
  namespace: togglemaster
spec:
  ports:
  - name: http
    port: 8001
    targetPort: http
  selector:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: togglemaster
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: auth-service
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
      app.kubernetes.io/part-of: togglemaster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      containers:
      - env:
        - name: PORT
          value: '8001'
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_HOST
              name: togglemaster-config
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              key: DB_PORT
              name: togglemaster-config
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_NAME
              name: togglemaster-config
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_USER
              name: togglemaster-config
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              key: DB_SSLMODE
              name: togglemaster-config
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: auth-runtime-secrets
        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: MASTER_KEY
              name: auth-runtime-secrets
        - name: BOOTSTRAP_API_KEY
          valueFrom:
            secretKeyRef:
              key: BOOTSTRAP_API_KEY
              name: auth-runtime-secrets
        - name: BOOTSTRAP_API_KEY_NAME
          value: oke-evaluation-service
        image: togglemaster/auth-service:bootstrap
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        name: auth-service
        ports:
        - containerPort: 8001
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /mnt/secrets-store
          name: secrets-store-inline
          readOnly: true
      imagePullSecrets:
      - name: ocir-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: auth-service
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: auth-runtime-secrets
        name: secrets-store-inline
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: auth-runtime-secrets
  namespace: togglemaster
spec:
  parameters:
    authType: workload
    secrets: "- name: __OCI_AUTH_APP_PASSWORD_SECRET_NAME__\n  stage: CURRENT\n  fileName:\
      \ DB_PASSWORD\n- name: __OCI_AUTH_MASTER_KEY_SECRET_NAME__\n  stage: CURRENT\n\
      \  fileName: MASTER_KEY\n- name: __OCI_INTERNAL_API_KEY_SECRET_NAME__\n  stage:\
      \ CURRENT\n  fileName: BOOTSTRAP_API_KEY\n"
    vaultId: __OCI_VAULT_ID__
  provider: oci
  secretObjects:
  - data:
    - key: DB_PASSWORD
      objectName: DB_PASSWORD
    - key: MASTER_KEY
      objectName: MASTER_KEY
    - key: BOOTSTRAP_API_KEY
      objectName: BOOTSTRAP_API_KEY
    secretName: auth-runtime-secrets
    type: Opaque
