apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: targeting-service
  namespace: togglemaster
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: targeting-service
  namespace: togglemaster
spec:
  ports:
  - name: http
    port: 8003
    targetPort: http
  selector:
    app.kubernetes.io/name: targeting-service
    app.kubernetes.io/part-of: togglemaster
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: targeting-service
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: targeting-service
      app.kubernetes.io/part-of: togglemaster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: targeting-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      containers:
      - env:
        - name: PORT
          value: '8003'
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              key: AUTH_SERVICE_URL
              name: togglemaster-config
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: TARGETING_DB_HOST
              name: togglemaster-config
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              key: DB_PORT
              name: togglemaster-config
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: TARGETING_DB_NAME
              name: togglemaster-config
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              key: TARGETING_DB_USER
              name: togglemaster-config
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              key: DB_SSLMODE
              name: togglemaster-config
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: targeting-runtime-secrets
        image: togglemaster/targeting-service:bootstrap
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        name: targeting-service
        ports:
        - containerPort: 8003
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 75m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /mnt/secrets-store
          name: secrets-store-inline
          readOnly: true
        - mountPath: /tmp
          name: tmp
      imagePullSecrets:
      - name: ocir-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: targeting-service
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: targeting-runtime-secrets
        name: secrets-store-inline
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: targeting-runtime-secrets
  namespace: togglemaster
spec:
  parameters:
    authType: workload
    secrets: "- name: togglemaster-targeting-service-app-password\n  stage: CURRENT\n\
      \  fileName: DB_PASSWORD\n"
    vaultId: ocid1.vault.oc1.iad.ejvkovgxaafh6.abuwcljtfemgj75poo34ezder6blmj24rz3oes2xqjrtexqf3jwmvowffoeq
  provider: oci
  secretObjects:
  - data:
    - key: DB_PASSWORD
      objectName: DB_PASSWORD
    secretName: targeting-runtime-secrets
    type: Opaque
