apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: analytics-service
  namespace: togglemaster
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: analytics-service
  namespace: togglemaster
spec:
  ports:
  - name: http
    port: 8005
    targetPort: http
  selector:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: togglemaster
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: analytics-service
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
      app.kubernetes.io/part-of: togglemaster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      containers:
      - env:
        - name: PORT
          value: '8005'
        - name: ANALYTICS_WORKER_ENABLED
          valueFrom:
            configMapKeyRef:
              key: ANALYTICS_WORKER_ENABLED
              name: togglemaster-config
        - name: OCI_AUTH_MODE
          valueFrom:
            configMapKeyRef:
              key: OCI_AUTH_MODE
              name: togglemaster-config
        - name: OCI_REGION
          valueFrom:
            configMapKeyRef:
              key: OCI_REGION
              name: togglemaster-config
        - name: OCI_QUEUE_OCID
          valueFrom:
            configMapKeyRef:
              key: OCI_QUEUE_OCID
              name: togglemaster-config
        - name: OCI_QUEUE_MESSAGES_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: OCI_QUEUE_MESSAGES_ENDPOINT
              name: togglemaster-config
        - name: OCI_NOSQL_TABLE
          valueFrom:
            configMapKeyRef:
              key: OCI_NOSQL_TABLE
              name: togglemaster-config
        - name: OCI_COMPARTMENT_OCID
          valueFrom:
            configMapKeyRef:
              key: OCI_COMPARTMENT_OCID
              name: togglemaster-config
        image: togglemaster/analytics-service:bootstrap
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        name: analytics-service
        ports:
        - containerPort: 8005
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      imagePullSecrets:
      - name: ocir-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: analytics-service
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: analytics-service
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      policies:
      - periodSeconds: 30
        type: Percent
        value: 100
      stabilizationWindowSeconds: 0
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 30
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
