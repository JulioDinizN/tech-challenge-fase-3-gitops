apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: evaluation-service
  namespace: togglemaster
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: evaluation-service
  namespace: togglemaster
spec:
  ports:
  - name: http
    port: 8004
    targetPort: http
  selector:
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/part-of: togglemaster
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: evaluation-service
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-service
      app.kubernetes.io/part-of: togglemaster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      containers:
      - env:
        - name: PORT
          value: '8004'
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              key: REDIS_URL
              name: togglemaster-config
        - name: FLAG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              key: FLAG_SERVICE_URL
              name: togglemaster-config
        - name: TARGETING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              key: TARGETING_SERVICE_URL
              name: togglemaster-config
        - name: OCI_AUTH_MODE
          valueFrom:
            configMapKeyRef:
              key: OCI_AUTH_MODE
              name: togglemaster-config
        - name: OCI_RESOURCE_PRINCIPAL_VERSION
          value: '2.2'
        - name: OCI_RESOURCE_PRINCIPAL_REGION
          valueFrom:
            configMapKeyRef:
              key: OCI_REGION
              name: togglemaster-config
        - name: OCI_QUEUE_OCID
          valueFrom:
            configMapKeyRef:
              key: OCI_QUEUE_OCID
              name: togglemaster-config
        - name: OCI_QUEUE_MESSAGES_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: OCI_QUEUE_MESSAGES_ENDPOINT
              name: togglemaster-config
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              key: SERVICE_API_KEY
              name: evaluation-runtime-secrets
        image: togglemaster/evaluation-service:bootstrap
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        name: evaluation-service
        ports:
        - containerPort: 8004
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /mnt/secrets-store
          name: secrets-store-inline
          readOnly: true
      imagePullSecrets:
      - name: ocir-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: evaluation-service
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: evaluation-runtime-secrets
        name: secrets-store-inline
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/part-of: togglemaster
  name: evaluation-service
  namespace: togglemaster
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      policies:
      - periodSeconds: 30
        type: Percent
        value: 100
      stabilizationWindowSeconds: 0
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-service
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: evaluation-runtime-secrets
  namespace: togglemaster
spec:
  parameters:
    authType: workload
    secrets: "- name: __OCI_INTERNAL_API_KEY_SECRET_NAME__\n  stage: CURRENT\n  fileName:\
      \ SERVICE_API_KEY\n"
    vaultId: __OCI_VAULT_ID__
  provider: oci
  secretObjects:
  - data:
    - key: SERVICE_API_KEY
      objectName: SERVICE_API_KEY
    secretName: evaluation-runtime-secrets
    type: Opaque
